<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d57"/>
      <stop offset="0.55" stop-color="#1f5a40"/>
      <stop offset="1" stop-color="#163f2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f2b53d"/>
      <stop offset="1" stop-color="#a8721a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5c451" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <pattern id="guilloche" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="5.5" fill="none" stroke="#9fe0b6" stroke-opacity="0.35" stroke-width="0.8"/>
      <circle cx="7" cy="7" r="2.8" fill="none" stroke="#9fe0b6" stroke-opacity="0.35" stroke-width="0.8"/>
    </pattern>
    <g id="bill">
      <rect x="-170" y="-80" width="340" height="160" rx="10" fill="url(#note)" stroke="#bfe9cf" stroke-opacity="0.65" stroke-width="3"/>
      <rect x="-170" y="-80" width="340" height="160" rx="10" fill="url(#guilloche)"/>
      <rect x="-154" y="-64" width="308" height="128" rx="6" fill="none" stroke="#bfe9cf" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="0" cy="0" r="50" fill="#123826" stroke="#bfe9cf" stroke-opacity="0.7" stroke-width="3"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#bfe9cf" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="0" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#d8f5e2" fill-opacity="0.9">$</text>
      <text x="-138" y="-36" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#d8f5e2" fill-opacity="0.85">100</text>
      <text x="138" y="-36" text-anchor="end" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#d8f5e2" fill-opacity="0.85">100</text>
      <text x="-138" y="58" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#d8f5e2" fill-opacity="0.85">100</text>
      <text x="138" y="58" text-anchor="end" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#d8f5e2" fill-opacity="0.85">100</text>
      <rect x="-118" y="-8" width="46" height="4" rx="2" fill="#bfe9cf" fill-opacity="0.5"/>
      <rect x="-118" y="2" width="36" height="4" rx="2" fill="#bfe9cf" fill-opacity="0.5"/>
      <rect x="72" y="-8" width="46" height="4" rx="2" fill="#bfe9cf" fill-opacity="0.5"/>
      <rect x="82" y="2" width="36" height="4" rx="2" fill="#bfe9cf" fill-opacity="0.5"/>
    </g>
    <g id="coin">
      <circle r="52" fill="url(#gold)" stroke="#fff1bd" stroke-opacity="0.7" stroke-width="3"/>
      <circle r="41" fill="none" stroke="#7a4e0c" stroke-opacity="0.55" stroke-width="3"/>
      <text y="22" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-weight="700" fill="#7a4e0c" fill-opacity="0.8">$</text>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#0b1120"/>
  <ellipse cx="800" cy="520" rx="760" ry="420" fill="url(#glow)"/>

  <g opacity="0.55">
    <use href="#bill" transform="translate(250 220) rotate(-14) scale(1.05)"/>
    <use href="#bill" transform="translate(760 150) rotate(7) scale(0.95)"/>
    <use href="#bill" transform="translate(1260 250) rotate(16) scale(1.1)"/>
    <use href="#bill" transform="translate(520 470) rotate(-6) scale(1.25)"/>
    <use href="#bill" transform="translate(1100 560) rotate(-17) scale(1)"/>
    <use href="#bill" transform="translate(1450 640) rotate(9) scale(0.9)"/>
    <use href="#bill" transform="translate(190 700) rotate(12) scale(1)"/>
    <use href="#bill" transform="translate(640 820) rotate(-10) scale(1.1)"/>
    <use href="#bill" transform="translate(1180 880) rotate(5) scale(1.05)"/>
  </g>

  <g opacity="0.75">
    <use href="#coin" transform="translate(95 460) scale(0.9)"/>
    <use href="#coin" transform="translate(980 380) scale(1.15)"/>
    <use href="#coin" transform="translate(1530 410) scale(0.8)"/>
    <use href="#coin" transform="translate(370 940) scale(1)"/>
    <use href="#coin" transform="translate(900 960) scale(0.85)"/>
    <use href="#coin" transform="translate(1390 120) scale(0.75)"/>
  </g>
</svg>
