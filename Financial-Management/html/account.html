<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/gauge.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/merge.css">
  <link rel="stylesheet" href="../css/account.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <noscript>برای استفاده از این برنامه باید جاوااسکریپت مرورگر فعال باشد.</noscript>

  <main class="page page--narrow stack page-enter">
    <header class="page__head">
      <div>
        <h1 class="page__title">حساب کاربری</h1>
        <p class="page__lead">مشخصات حساب شما؛ با دکمه‌ی کپی کنار هر مورد یا لمس خود متن می‌توانید آن را کپی کنید.</p>
      </div>
    </header>

    <section class="card account-hero" aria-label="خلاصه‌ی حساب">
      <span class="account-hero__avatar" aria-hidden="true"><span data-icon="user" data-size="34"></span></span>
      <div class="account-hero__text">
        <h2 class="account-hero__name" id="acc-name">…</h2>
        <span class="account-hero__mail" id="acc-email"></span>
      </div>
    </section>

    <section class="card" aria-labelledby="info-title">
      <div class="card__head">
        <span data-icon="list"></span>
        <h2 class="card__title" id="info-title">جزئیات پروفایل</h2>
        <button class="btn btn--ghost btn--sm card__aside" id="copy-all" type="button"><span data-icon="copy" data-size="18"></span> کپی همه</button>
      </div>
      <div class="info-list" id="account-fields" role="list"></div>
    </section>

    <section class="account-links">
      <a class="btn btn--ghost" href="change-password.html"><span data-icon="lock" data-size="18"></span> تغییر رمز عبور</a>
      <a class="btn btn--ghost" href="merge.html"><span data-icon="users" data-size="18"></span> ادغام</a>
    </section>
  </main>

  <script type="module" src="../js/account-page.js"></script>

</html>
