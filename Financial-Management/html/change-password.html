<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
  <meta name="description" content="مدیریت هزینه‌ها و اقساط: ثبت درآمد و بدهی، تقویم شمسی و نمودار وضعیت مالی ماه آینده">
  <meta name="robots" content="noindex">
  <title>تغییر رمز عبور | مدیریت هزینه‌ها و اقساط</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5c451'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='700' text-anchor='middle' font-family='Georgia,serif' fill='%231a1204'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/gauge.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/merge.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <noscript>برای استفاده از این برنامه باید جاوااسکریپت مرورگر فعال باشد.</noscript>

  <main class="page page--narrow stack page-enter">
    <header class="page__head">
      <div>
        <h1 class="page__title">تغییر رمز عبور</h1>
        <p class="page__lead">حساب: <span class="state-email" id="account-email" style="margin:0"></span></p>
      </div>
    </header>

    <section class="card" aria-labelledby="pw-title">
      <div class="card__head">
        <span data-icon="lock"></span>
        <h2 class="card__title" id="pw-title">رمز عبور جدید</h2>
      </div>

      <div id="password-message" class="form-message" role="alert" hidden></div>

      <form id="password-form" novalidate>
        <div class="field">
          <label class="field__label" for="current-password">رمز عبور فعلی</label>
          <div class="field__control">
            <span class="field__icon" data-icon="lock"></span>
            <input class="input input--icon input--toggle input--ltr" id="current-password" name="current-password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button class="field__toggle" type="button" data-toggle-password="#current-password"></button>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="new-password">رمز عبور جدید</label>
          <div class="field__control">
            <span class="field__icon" data-icon="lock"></span>
            <input class="input input--icon input--toggle input--ltr" id="new-password" name="new-password" type="password" autocomplete="new-password" placeholder="حداقل ۸ نویسه شامل حرف و عدد" required>
            <button class="field__toggle" type="button" data-toggle-password="#new-password"></button>
          </div>
          <div class="strength is-empty" id="strength" data-level="0" aria-live="polite">
            <span class="strength__bar"></span><span class="strength__bar"></span><span class="strength__bar"></span><span class="strength__bar"></span>
            <span class="strength__label"></span>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="new-password-confirm">تکرار رمز عبور جدید</label>
          <div class="field__control">
            <span class="field__icon" data-icon="lock"></span>
            <input class="input input--icon input--toggle input--ltr" id="new-password-confirm" name="new-password-confirm" type="password" autocomplete="new-password" placeholder="••••••••" required>
            <button class="field__toggle" type="button" data-toggle-password="#new-password-confirm"></button>
          </div>
        </div>
        <p class="field__hint" style="margin-top:14px">پس از تغییر، نشست‌های دیگر حساب شما (روی سایر دستگاه‌ها) بسته می‌شود.</p>
        <button class="btn btn--primary btn--block auth-submit" id="password-submit" type="submit" style="margin-top:14px">ذخیره‌ی رمز جدید</button>
      </form>
    </section>
  </main>

  <script type="module" src="../js/change-password-page.js"></script>
</body>
</html>
