<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
  <meta name="description" content="مدیریت هزینه‌ها و اقساط: ثبت درآمد و بدهی، تقویم شمسی و نمودار وضعیت مالی ماه آینده">
  <meta name="robots" content="noindex">
  <title>رمز عبور جدید | مدیریت هزینه‌ها و اقساط</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5c451'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='700' text-anchor='middle' font-family='Georgia,serif' fill='%231a1204'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <noscript>برای استفاده از این برنامه باید جاوااسکریپت مرورگر فعال باشد.</noscript>

  <main class="auth">
    <div class="auth-wrap">
      <section class="card auth-card" aria-labelledby="reset-title">
        <div class="auth-card__logo" aria-hidden="true">$</div>
        <h1 class="auth-card__title" id="reset-title">تعیین رمز عبور جدید</h1>
        <p class="auth-card__lead">رمز تازه‌ای انتخاب کنید که قبلاً استفاده نکرده‌اید.</p>

        <div id="reset-message" class="form-message" role="alert" hidden></div>

        <div id="reset-invalid" class="state-panel">
          <div class="state-icon"><span data-icon="clock" data-size="40"></span></div>
          <p>در حال بررسی لینک بازیابی…</p>
          <div class="state-actions">
            <a class="btn btn--ghost btn--block" href="forgot.html">درخواست لینک تازه</a>
          </div>
        </div>

        <form id="reset-form" novalidate hidden>
        <div class="field">
          <label class="field__label" for="password">رمز عبور جدید</label>
          <div class="field__control">
            <span class="field__icon" data-icon="lock"></span>
            <input class="input input--icon input--toggle input--ltr" id="password" name="password" type="password" autocomplete="new-password" placeholder="حداقل ۸ نویسه شامل حرف و عدد" required>
            <button class="field__toggle" type="button" data-toggle-password="#password"></button>
          </div>
          <div class="strength is-empty" id="strength" data-level="0" aria-live="polite">
            <span class="strength__bar"></span><span class="strength__bar"></span><span class="strength__bar"></span><span class="strength__bar"></span>
            <span class="strength__label"></span>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="password-confirm">تکرار رمز عبور جدید</label>
          <div class="field__control">
            <span class="field__icon" data-icon="lock"></span>
            <input class="input input--icon input--toggle input--ltr" id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="••••••••" required>
            <button class="field__toggle" type="button" data-toggle-password="#password-confirm"></button>
          </div>
        </div>
          <button class="btn btn--primary btn--block auth-submit" id="reset-submit" type="submit" style="margin-top:22px">ذخیره‌ی رمز جدید</button>
        </form>

        <div class="auth-card__foot">
          <a href="../index.html">بازگشت به صفحه‌ی ورود</a>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="../js/reset-page.js"></script>
</body>
</html>
