<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)">
  <meta name="description" content="مدیریت هزینه‌ها و اقساط: ثبت درآمد و بدهی، تقویم شمسی و نمودار وضعیت مالی ماه آینده">
  <meta name="robots" content="noindex">
  <title>تأیید ایمیل | مدیریت هزینه‌ها و اقساط</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5c451'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='700' text-anchor='middle' font-family='Georgia,serif' fill='%231a1204'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/toast.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <noscript>برای استفاده از این برنامه باید جاوااسکریپت مرورگر فعال باشد.</noscript>

  <main class="auth">
    <div class="auth-wrap">
      <section class="card auth-card" aria-live="polite">
        <div id="state-working" class="state-panel">
          <div class="state-icon"><span data-icon="clock" data-size="40"></span></div>
          <h1>در حال تأیید ایمیل…</h1>
          <p>لطفاً چند لحظه صبر کنید.</p>
        </div>

        <div id="state-success" class="state-panel" hidden>
          <div class="state-icon state-icon--success"><span data-icon="check" data-size="40"></span></div>
          <h1>ایمیل شما تأیید شد</h1>
          <p>حساب شما فعال است. تا <span class="countdown-ring" id="countdown">۶</span> ثانیه‌ی دیگر به داشبورد وضعیت مالی می‌روید.</p>
          <div class="state-actions">
            <button class="btn btn--primary btn--block" id="go-dashboard" type="button">رفتن به داشبورد</button>
          </div>
        </div>

        <div id="state-failure" class="state-panel" hidden>
          <div class="state-icon state-icon--error"><span data-icon="warning" data-size="40"></span></div>
          <h1>تأیید انجام نشد</h1>
          <p id="failure-text"></p>
          <div class="state-actions">
            <a class="btn btn--primary btn--block" href="../index.html">رفتن به صفحه‌ی ورود</a>
            <a class="btn btn--ghost btn--block" href="register.html">ثبت نام دوباره</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="../js/verified-page.js"></script>
</body>
</html>
