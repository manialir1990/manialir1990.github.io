<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>Money Coin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/coin3d.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body>
<div class="bg"></div>
<div class="bg-light"></div>
<a class="mine-link" href="login.html">Money Mining</a>
<main class="landing">
  <section class="stage" id="stage" aria-label="سکه Money">
    <div class="glow"></div>
    <div class="shadow" id="shadow"></div>
    <div class="coin-wrap" id="coinWrap"><div class="coin3d" id="coin"></div></div>
  </section>
  <h1 class="formula">1 <span class="msym">M</span> = 1 M$</h1>
  <p class="sub">یک واحد پول Money Coin برابر با یک میلیون دلار ارزش دارد.</p>
  <form class="ask" id="f" novalidate>
    <label for="n">با چه مقدار سکه می‌خواهی بازی کنی؟</label>
    <div class="row">
      <input id="n" type="text" inputmode="numeric" autocomplete="off" placeholder="۱ تا ۱۰۰" aria-describedby="err">
      <button class="go" type="submit" aria-label="شروع بازی"><img src="assets/coin-back.png" alt=""></button>
    </div>
    <p id="err" role="alert"></p>
  </form>
</main>
<script src="js/utils.js"></script>
<script src="js/coin3d.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
