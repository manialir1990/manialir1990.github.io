<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0907"><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=Orbitron:wght@700&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><title>Money Mining | ورود</title><link rel="stylesheet" href="css/auth.css"></head>
<body><div class="bg"></div><div class="bg-light"></div>
<main class="auth"><a class="home" href="index.html">بازگشت به صفحه اول</a>
<section class="card"><h1 class="royal">Money Mining</h1>
<form id="loginForm" novalidate><h2>ورود</h2>
<input id="le" type="email" dir="ltr" placeholder="ایمیل" autocomplete="email" required>
<input id="lp" type="password" dir="ltr" placeholder="رمز عبور" autocomplete="current-password" required>
<button class="btn" type="submit">ورود</button></form>
<form id="signForm" novalidate hidden><h2>ثبت‌نام</h2>
<input id="se" type="email" dir="ltr" placeholder="ایمیل" autocomplete="email" required>
<input id="sp" type="password" dir="ltr" placeholder="رمز عبور (حداقل ۶ کاراکتر)" autocomplete="new-password" required>
<input id="sp2" type="password" dir="ltr" placeholder="تکرار رمز عبور" autocomplete="new-password" required>
<button class="btn" type="submit">ثبت‌نام و ارسال ایمیل تأیید</button></form>
<p id="msg" role="alert"></p>
<p class="swap"><span id="swapText">حساب نداری؟</span> <button type="button" id="swap">ثبت‌نام</button></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/utils.js"></script><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
