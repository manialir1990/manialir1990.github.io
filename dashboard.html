<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد</title><link rel="stylesheet" href="css/theme.css"></head><body>
<main class="wrap"><h2 style="margin-top:48px">داشبورد</h2><div class="card"><h3>مشخصات</h3><div class="grid" id="inf"></div></div>
<div class="card"><h3>واریزی‌ها</h3><div id="pay"></div></div><div class="card"><h3>تعهدات مالی</h3><div id="obl"></div></div>
<div class="grid"><a class="card lk" href="invitations.html"><span class="ic">📨</span><h3>دعوتنامه‌ها و ابلاغیه‌ها</h3></a><a class="card lk" href="minutes.html"><span class="ic">📋</span><h3>صورت‌جلسات</h3></a></div>
<div class="card"><h3>رتبه‌بندی امتیاز</h3><div id="rk"></div></div>
<div class="card"><h3>لطفا درخواست و پیشنهاد خود را ارسال فرمایید</h3><textarea id="rq" rows="5" style="font-family:'B Nazanin',Vazirmatn;font-size:14pt;color:#000;background:#fff"></textarea><button id="snd">ارسال</button> <span id="rs"></span></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>(async()=>{const m=await need();shell(m);
const[p,o,l,h]=await Promise.all([sb.from('payments').select('*').eq('national_id',m.national_id).order('paid_at',{ascending:false}),sb.from('obligations').select('*').eq('national_id',m.national_id).order('due_at'),sb.rpc('leaderboard'),sb.rpc('my_hash')]);
const paid=(p.data||[]).reduce((a,x)=>a+ +x.amount,0),debt=(o.data||[]).reduce((a,x)=>a+ +x.amount,0);
const f=[['نام',m.first_name],['نام خانوادگی',m.last_name],['کد ملی',m.national_id],['موبایل',m.mobile],['ایمیل',m.email],['شرکت مادر',m.parent_company],['وضعیت عضویت',m.status],['تعاونی',m.coop],['جمع پرداختی‌ها',money(paid)],['میزان بدهی',money(Math.max(debt-paid,0))],['امتیاز',m.score]];
$('#inf').innerHTML=f.map(([k,v])=>`<div class="kv"><small>${k}</small>${v??'—'}</div>`).join('');
$('#pay').innerHTML=tbl(['مبلغ','تاریخ'],(p.data||[]).map(x=>`<tr><td>${money(x.amount)}</td><td>${x.paid_at||''}</td></tr>`));
$('#obl').innerHTML=tbl(['مبلغ','سررسید'],(o.data||[]).map(x=>`<tr><td>${money(x.amount)}</td><td>${x.due_at||''}</td></tr>`));
$('#rk').innerHTML=tbl(['رتبه','نام','امتیاز'],(l.data||[]).map((x,i)=>`<tr class="${x.id===h.data?'me':''}"><td>${i+1}</td><td>${x.first_name} ${x.last_name}</td><td>${x.score}</td></tr>`));
const r=$('#rk .me');if(r){const s=$('#rk .scroll');s.scrollTop=r.offsetTop-s.clientHeight/2+r.clientHeight/2}
$('#snd').onclick=async()=>{const e=await sb.from('requests').insert({national_id:m.national_id,full_name:m.first_name+' '+m.last_name,body:$('#rq').value});
$('#rs').textContent=e.error?e.error.message:'ارسال شد';if(!e.error)$('#rq').value=''}})()</script></body></html>
