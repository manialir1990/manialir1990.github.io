<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>مدیریت</title><link rel="stylesheet" href="css/theme.css"></head><body class="adm">
<main class="wrap"><h2 style="margin-top:48px">پنل مدیریت</h2>

<div class="card" id="db"><div class="tabs"><button class="sec" data-v="members">اعضا<i class="nb" id="nb-members" hidden></i></button><button class="sec" data-v="payments">واریزی‌ها<i class="nb" id="nb-payments" hidden></i></button><button class="sec" data-v="obligations">تعهدات<i class="nb" id="nb-obligations" hidden></i></button><button class="sec" data-v="requests">درخواست‌ها<i class="nb" id="nb-requests" hidden></i></button></div><div id="tb"></div></div>
