<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>فراموشی رمز عبور</title><link rel="stylesheet" href="css/theme.css"></head><body>
<div class="trail"><i></i><i></i><i></i></div>
<main class="wrap"><section class="hero"><div class="card" style="width:min(420px,100%)"><h1>فراموشی رمز عبور</h1>
<div id="s1"><input id="ni" placeholder="کد ملی" inputmode="numeric"><input id="em" type="email" placeholder="ایمیل ثبت‌شده"><button id="a1" style="width:100%">ارسال کد</button></div>
<div id="s2" hidden><input id="cd" placeholder="کد ارسال‌شده به ایمیل" inputmode="numeric"><button id="a2" style="width:100%">تایید کد</button></div>
<div id="s3" hidden><input id="pw" type="password" placeholder="رمز عبور جدید"><input id="p2" type="password" placeholder="تکرار رمز عبور جدید"><button id="a3" style="width:100%">تعیین رمز جدید</button></div>
<div class="msg" id="ms"></div><p><a href="index.html" style="color:var(--ac)">بازگشت به ورود</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
const E={mismatch:'کد ملی و ایمیل با هم منطبق نیستند',mail:'ارسال ایمیل ناموفق بود',bad:'کد نادرست یا منقضی شده است',locked:'تعداد تلاش‌ها بیش از حد مجاز است',net:'خطا در ارتباط با سرور'};
const call=async b=>{const r=await sb.functions.invoke('password-reset',{body:b});return r.error?{ok:false,error:'net'}:r.data};
const ms=(t,ok)=>{$('#ms').style.color=ok?'var(--ac)':'var(--bad)';$('#ms').textContent=t};
const show=n=>['s1','s2','s3'].forEach(i=>$('#'+i).hidden=i!=='s'+n);
let nid,code;
$('#a1').onclick=async()=>{ms('');nid=nd($('#ni').value);const r=await call({action:'request',nid,email:$('#em').value.trim()});if(!r.ok)return ms(E[r.error]||E.net);show(2);ms('کد به ایمیل شما ارسال شد',1)};
$('#a2').onclick=async()=>{ms('');code=nd($('#cd').value);const r=await call({action:'verify',nid,code});if(!r.ok)return ms(E[r.error]||E.net);show(3)};
$('#a3').onclick=async()=>{ms('');const pw=$('#pw').value;if(pw.length<6)return ms('رمز عبور حداقل ۶ کاراکتر باشد');if(pw!==$('#p2').value)return ms('رمز عبور و تکرار آن یکسان نیست');
 const r=await call({action:'confirm',nid,code,password:pw+CFG.pad});if(!r.ok)return ms(E[r.error]||E.net);location='index.html'};
</script><script src="js/fx.js"></script></body></html>
