<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>تعاونی مسکن مپنا هوایی</title><link rel="stylesheet" href="css/theme.css"></head><body>
<div class="trail"><i></i><i></i><i></i></div>
<main class="wrap"><section class="hero"><div class="card" style="width:min(420px,100%)"><h1>تعاونی مسکن مپنا هوایی</h1>
<div id="lg"><input id="u" placeholder="کد ملی" inputmode="numeric"><input id="p" type="password" placeholder="رمز عبور"><button id="go" style="width:100%">ورود</button>
<p><a href="#" id="fl" style="color:var(--ac)">فراموشی رمز عبور</a> &nbsp;|&nbsp; <a href="register.html" style="color:var(--ac)">ثبت‌نام</a></p></div>
<div id="fg" hidden><h3>بازیابی رمز عبور</h3><input id="fu" placeholder="کد ملی" inputmode="numeric"><input id="fe" type="email" placeholder="ایمیل ثبت‌شده"><button id="fs" style="width:100%">ارسال کد بازیابی</button>
<div id="s2" hidden><input id="fc" placeholder="کد بازیابی" inputmode="numeric"><input id="fp" type="password" placeholder="رمز عبور جدید"><input id="fq" type="password" placeholder="تکرار رمز عبور جدید"><button id="fr" style="width:100%">تغییر رمز عبور</button></div>
<p><a href="#" id="fb" style="color:var(--ac)">بازگشت به ورود</a></p></div>
<div class="msg" id="ms"></div></div></section>
<div class="grid"><a class="card lk" href="location.html"><span class="ic">📍</span><h3>موقعیت پروژه</h3></a><a class="card lk" href="news.html"><span class="ic">📰</span><h3>اخبار</h3></a><a class="card lk" href="companies.html"><span class="ic">🏢</span><h3>شرکت‌های مادر</h3></a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
const ms=(t,ok)=>{$('#ms').style.color=ok?'var(--ac)':'var(--bad)';$('#ms').textContent=t};
const show=f=>{$('#lg').hidden=f;$('#fg').hidden=!f;ms('')};
$('#go').onclick=async()=>{ms('');const nid=nd($('#u').value),pw=nd($('#p').value);
 const r=await sb.auth.signInWithPassword({email:nid+CFG.dom,password:pw+CFG.pad});
 if(r.error)return ms('کد ملی یا رمز عبور اشتباه است');
 if(!await me()){await sb.auth.signOut();return ms('حساب شما هنوز توسط ادمین تایید نشده است')}
 location='dashboard.html'};
$('#fl').onclick=e=>{e.preventDefault();show(true)};$('#fb').onclick=e=>{e.preventDefault();show(false)};
$('#fs').onclick=async()=>{await sb.functions.invoke('forgot-password',{body:{action:'request',nid:nd($('#fu').value),email:$('#fe').value.trim()}}).catch(()=>{});
 ms('در صورت صحیح بودن اطلاعات، کد بازیابی به ایمیل شما ارسال شد.',1);$('#s2').hidden=false};
$('#fr').onclick=async()=>{const p=nd($('#fp').value);if(p.length<6)return ms('رمز عبور حداقل ۶ کاراکتر باشد');if(p!==nd($('#fq').value))return ms('تکرار رمز عبور مطابقت ندارد');
 const r=await sb.functions.invoke('forgot-password',{body:{action:'reset',nid:nd($('#fu').value),code:nd($('#fc').value),password:p}});
 if(r.error||!r.data?.ok)return ms('کد نادرست یا منقضی شده است');show(false);ms('رمز عبور تغییر کرد. وارد شوید.',1)};
me().then(m=>{if(m)location='dashboard.html'});
</script><script src="js/fx.js"></script></body></html>
