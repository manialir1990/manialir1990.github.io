<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/base.css"><title>تکمیل ثبت‌نام</title><link rel="stylesheet" href="css/login.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body class="login"><div class="hero"><h1>تکمیل ثبت‌نام</h1>
<div class="card login-box"><h2>انتخاب رمز جدید و ثبت ایمیل</h2><label>رمز عبور جدید</label><input id="a" type="password"><label>تکرار رمز عبور</label><input id="b" type="password"><label>ایمیل</label><input id="e" type="email" dir="ltr"><button class="btn" id="go">ثبت و ورود</button><div class="msg" id="m"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="js/config.js"></script><script src="js/jalali.js"></script><script src="js/github.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>Sess.need();document.getElementById('go').onclick=async()=>{m.className='msg';m.textContent='در حال ذخیره…';try{location.href=await doRegister(a.value,b.value,e.value)}catch(x){m.className='msg er';m.textContent=x.message}}</script></body></html>
