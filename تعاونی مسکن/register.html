<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>ثبت‌نام</title><link rel="stylesheet" href="css/theme.css"></head><body>
<div class="trail"><i></i><i></i><i></i></div>
<main class="wrap"><section class="hero"><div class="card" style="width:min(420px,100%)"><h1>ثبت‌نام</h1>
<input id="fn" placeholder="نام"><input id="ln" placeholder="نام خانوادگی"><input id="ni" placeholder="کد ملی" inputmode="numeric" maxlength="10"><input id="mb" placeholder="شماره موبایل" inputmode="numeric" maxlength="11"><input id="em" type="email" placeholder="ایمیل"><input id="cd" placeholder="کد تاییدیه"><input id="pw" type="password" placeholder="رمز عبور"><input id="pw2" type="password" placeholder="تکرار رمز عبور">
<button id="go" style="width:100%">ثبت درخواست</button><div class="msg" id="ms"></div><p><a href="index.html" style="color:var(--ac)">بازگشت به ورود</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>
const M={ok:'درخواست شما ثبت شد. پس از تایید ادمین می‌توانید با کد ملی و رمز عبور وارد شوید.',invalid:'اطلاعات واردشده معتبر نیست',exists:'این کد ملی قبلاً عضو شده است',pending:'درخواست این کد ملی در انتظار تایید است'};
const ms=(t,ok)=>{$('#ms').style.color=ok?'var(--ac)':'var(--bad)';$('#ms').textContent=t};
$('#go').onclick=async()=>{ms('');const v=i=>$('#'+i).value.trim(),nid=nd(v('ni')),mob=nd(v('mb')),pw=nd($('#pw').value),mail=v('em');
 if(!v('fn')||!v('ln')||!v('cd'))return ms('همه‌ی فیلدها الزامی است');
 if(!/^\d{10}$/.test(nid))return ms('کد ملی باید ۱۰ رقم باشد');if(!/^09\d{9}$/.test(mob))return ms('شماره موبایل معتبر نیست');
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail))return ms('ایمیل معتبر نیست');
 if(pw.length<6)return ms('رمز عبور حداقل ۶ کاراکتر باشد');if(pw!==nd($('#pw2').value))return ms('تکرار رمز عبور مطابقت ندارد');
 const st=await sb.rpc('signup_state',{nid});if(st.data&&st.data!=='ok')return ms(M[st.data]);
 const email=nid+CFG.dom,password=pw+CFG.pad;let r=await sb.auth.signUp({email,password});
 if(r.error||!r.data.session){r=await sb.auth.signInWithPassword({email,password});if(r.error)return ms(/confirm/i.test(r.error.message)?'تایید ایمیل در Supabase باید خاموش باشد':'ثبت‌نام با این کد ملی انجام نشد')}
 const x=await sb.rpc('submit_signup',{nid,fn:v('fn'),ln:v('ln'),mob,mail,code:v('cd')});await sb.auth.signOut();
 if(x.error)return ms(x.error.message);ms(M[x.data]||x.data,x.data==='ok')};
</script></body></html>
